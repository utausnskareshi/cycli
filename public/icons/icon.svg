<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Cycliアイコン: 月と花のモチーフ -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8BBD0"/>
      <stop offset="100%" stop-color="#CE93D8"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 円（周期を表現） -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#fff" stroke-width="20" stroke-dasharray="40 24" stroke-linecap="round"/>
  <!-- 花びら4枚 -->
  <g fill="#fff" opacity="0.95">
    <ellipse cx="256" cy="170" rx="34" ry="50"/>
    <ellipse cx="342" cy="256" rx="50" ry="34"/>
    <ellipse cx="256" cy="342" rx="34" ry="50"/>
    <ellipse cx="170" cy="256" rx="50" ry="34"/>
  </g>
  <!-- 中央の円 -->
  <circle cx="256" cy="256" r="40" fill="#E57373"/>
</svg>
